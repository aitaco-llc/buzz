name: BuzzNative
options:
  bundleIdPrefix: com.aitaco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 5F7YLJS4YR
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
packages:
  BuzzCore:
    path: BuzzCore
  BuzzPushKit:
    path: ../mobile/ios/BuzzPushKit
targets:
  Buzz:
    type: application
    platform: iOS
    sources:
      - path: Buzz
        excludes: ["Embedded/**"]
      - path: ../mobile/ios/Runner/HuddleAudioEngine.swift
      - path: ../mobile/ios/Runner/MediaSanitizer.swift
      - path: ../mobile/assets/emoji/emoji-data.json
        buildPhase: resources
      - path: ../mobile/assets/images/aitaco-mark.png
        buildPhase: resources
    dependencies:
      - package: BuzzCore
      - target: NotificationService
      - sdk: DeclaredAgeRange.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.aitaco.buzz
        PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]: com.aitaco.buzz.ipad
        BUZZ_APP_GROUP_IDENTIFIER: group.co.aitaco.buzz
        BUZZ_KEYCHAIN_ACCESS_GROUP: co.aitaco.buzz
        BUZZ_IOS_PUSH_ENVIRONMENT: development
        BUZZ_APP_ATTEST_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: aitaco
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a pairing QR code to connect this iPad to your aitaco identity.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: aitaco needs microphone access to record voice notes.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Buzz/Buzz.entitlements
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: ../mobile/ios/NotificationService
    dependencies:
      - package: BuzzPushKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.aitaco.buzz.NotificationService
        PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]: com.aitaco.buzz.ipad.NotificationService
        INFOPLIST_FILE: ../mobile/ios/NotificationService/Info.plist
        BUZZ_APP_GROUP_IDENTIFIER: group.co.aitaco.buzz
        BUZZ_KEYCHAIN_ACCESS_GROUP: co.aitaco.buzz
        DEVELOPMENT_LANGUAGE: en
        FLUTTER_BUILD_NAME: 0.1.0
        FLUTTER_BUILD_NUMBER: 1
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
  BuzzAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BuzzAppTests
      - BuzzAppTests/InvitesTests.swift
      - BuzzAppTests/AgeGateTests.swift
      - BuzzAppTests/HuddleTests.swift
      - BuzzAppTests/NativePreferencesTests.swift
      - BuzzAppTests/PushNavigationTests.swift
      - BuzzAppTests/RichTextTests.swift
    dependencies:
      - target: Buzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aitaco.buzz.ipad.apptests
        GENERATE_INFOPLIST_FILE: YES
  BuzzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BuzzUITests]
    dependencies:
      - target: Buzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aitaco.buzz.ipad.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Buzz:
    build:
      targets:
        Buzz: all
    test:
      targets: [BuzzAppTests, BuzzUITests]
