name: Native iPad
on:
  pull_request:
    paths:
      - 'ipad/**'
      - 'mobile/ios/BuzzPushKit/**'
      - 'mobile/assets/emoji/**'
      - '.github/workflows/native-ipad.yml'
  push:
    branches: [main]
    paths:
      - 'ipad/**'
      - 'mobile/ios/BuzzPushKit/**'
      - 'mobile/assets/emoji/**'
      - '.github/workflows/native-ipad.yml'
permissions:
  contents: read
concurrency:
  group: native-ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-ipad:
    # macos-latest is macos-26 with Xcode 26; macos-15 ships an Xcode that
    # cannot parse the Swift 6.2 raw identifiers in the BuzzPushKit tests. Every
    # other macOS job in this repo already floats on macos-latest.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Test packages, exercise iPad UI, and build Release
        run: ipad/scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ipad-test-results
          path: ipad/DerivedData/Logs/Test/*.xcresult
          retention-days: 14
