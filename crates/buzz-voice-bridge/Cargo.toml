# Outside the root workspace on purpose, like desktop/src-tauri. The bridge
# links libopus through audiopus_sys, a native build (CMake when no system
# libopus is found). Kept out, it cannot reach the relay's Docker image, where
# `cargo chef cook` builds every root member, or the Windows server check.
# audiopus_sys is flagged unmaintained (RUSTSEC-2026-0150): its bundled build
# predates CMake 4. On hip it links the system libopus 1.6.1 via pkg-config.
# Desktop ships the same opus 0.3.
[workspace]
members = ["."]

[package]
name = "buzz-voice-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/aitaco-llc/buzz"
publish = false
description = "Headless voice bridge: joins a Buzz huddle and runs a Gemini Live conversation"

[[bin]]
name = "buzz-voice-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
buzz-sdk = { path = "../buzz-sdk" }
buzz-ws-client = { path = "../buzz-ws-client" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
nostr = { version = "0.44", features = ["nip44", "nip98"] }
opus = "0.3"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
