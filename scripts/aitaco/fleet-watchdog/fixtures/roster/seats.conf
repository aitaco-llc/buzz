# The fleet, in one place. Every script reads this; nothing else lists seats.
#
#   name        body    pack              channels (comma-separated, no #)
#
# name      the @handle, the env file name, the supervisor job name. Lowercase,
#           [a-z][a-z0-9-]*. Must equal the display name or @mentions break.
# body      which machine runs it: hip (Linux, systemd) or metal (Mac, launchd).
# pack      packs/<pack>/agents/<name>.persona.md must exist.
# channels  what `agentctl add-seat` joins the seat to. Membership is the gate:
#           buzz-acp subscribes only to channels the agent is a member of.
#
# To add a team member: write the persona, add a line here, commit and push,
# then `agentctl add-seat <name>`. Whitespace-separated; keep it aligned.

